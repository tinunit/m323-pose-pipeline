[project]
name = "pose-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "hypothesis>=6.170.5",
    "opencv-python>=5.0.0.93",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.183",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Linux: CPU-only torch statt CUDA-Build (spart ~5 GB). Windows/macOS: Standard-Wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
